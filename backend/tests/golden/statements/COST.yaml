# Costco Wholesale Corporation (CIK 909832) — golden figures from the 10-K documents on sec.gov, never from companyfacts.
# Values are USD (EPS: USD per share) in the displayed sign convention: expenses positive,
# capex negative (an outflow). Read from the filings' R pages (XBRL viewer renderings of the statements).
#   FY2015: 10-K filed 2015-10-14, accession 0000909832-15-000014 (FYE 2015-08-30)
#   FY2020: 10-K filed 2020-10-07, accession 0000909832-20-000017 (FYE 2020-08-30)
#   FY2026: 10-K filed 2026-10-07, accession 0000909832-26-000093 (FYE 2026-08-30)
# Each 10-K was checked for total liabilities + total equity = total assets.
# FY2015 total assets and total liabilities are the restated figures from the FY2016 10-K
# (accession 0000909832-16-000032, ASU 2015-03 / 2015-17 applied retrospectively): the engine shows the latest
# vintage, and the original FY2015 10-K value stays available as an earlier vintage.
# Costco's income statement has no gross profit line: gross_profit is total revenue (which includes
# membership fees) minus merchandise costs, the `derive` formula of the canonical item.
#   FY2015: 116,199 - 101,065 = 15,134   FY2020: 166,761 - 144,939 = 21,822   FY2026: 303,154 - 264,279 = 38,875
# net_income includes noncontrolling interests (FY2015 2,409 vs 2,377 attributable; FY2020 4,059 vs 4,002).
annual:
  FY2015:
    revenue: 116199000000
    gross_profit: 15134000000
    operating_income: 3624000000
    net_income: 2409000000
    eps_diluted: 5.37
    cash: 4801000000
    total_assets: 33017000000       # restated in the FY2016 10-K; the FY2015 10-K said 33,440
    total_liabilities: 22174000000  # restated in the FY2016 10-K; the FY2015 10-K said 22,597
    total_equity: 10843000000
    cfo: 4285000000
    capex: -2393000000
  FY2020:
    revenue: 166761000000
    gross_profit: 21822000000
    operating_income: 5435000000
    net_income: 4059000000
    eps_diluted: 9.02
    cash: 12277000000
    total_assets: 55556000000
    total_liabilities: 36851000000
    total_equity: 18705000000
    cfo: 8861000000
    capex: -2810000000
  FY2026:
    revenue: 303154000000
    gross_profit: 38875000000
    operating_income: 11685000000
    net_income: 9226000000
    eps_diluted: 20.76
    cash: 20207000000
    total_assets: 89045000000
    total_liabilities: 53242000000
    total_equity: 35803000000
    cfo: 15817000000
    capex: -6435000000

# Q4 (16 weeks) of the latest FY = 10-K FY revenue minus the 36-week revenue of the Q3 10-Q
# (accession 0000909832-26-000051, 36 weeks ended 2026-05-10: 207,431 million).
# 303,154 - 207,431 = 95,723 million.
quarterly:
  FY2026Q4:
    revenue: 95723000000

# Non-residual codes with no value in some fiscal year, and why. The test compares the codes with
# `missing_items`; the reasons are for the reader. Early years: XBRL balance sheets start with FY2008-09
# and the older columns only exist as comparatives.
expected_missing:
  rnd: "Costco reports no research and development"
  pretax_income: "no XBRL fact before FY2009"
  net_income_nci: "noncontrolling interests ended in FY2023 and the line is no longer tagged"
  eps_basic: "no XBRL fact before FY2009"
  eps_diluted: "no XBRL fact before FY2009"
  short_term_investments: "no XBRL fact before FY2009"
  receivables: "no XBRL fact before FY2009"
  inventory: "no XBRL fact before FY2009"
  total_current_assets: "no XBRL fact before FY2009"
  total_noncurrent_assets: "derived from total current assets, so absent where that is (FY2008)"
  total_noncurrent_liabilities: "derived from total current liabilities, so absent where that is (FY2008)"
  operating_lease_rou: "no XBRL fact before FY2019"
  goodwill: "goodwill tagged only from FY2019 (and FY2009-13)"
  intangibles: "no separate intangibles line"
  long_term_investments: "no long-term investments"
  accounts_payable: "no XBRL fact before FY2009"
  short_term_debt: "no XBRL fact before FY2009"
  deferred_revenue_current: "'deferred membership fees' tagged from FY2016"
  accrued_liabilities: "'accrued member rewards' tagged from FY2020"
  total_current_liabilities: "no XBRL fact before FY2009"
  long_term_debt: "no XBRL fact before FY2009"
  operating_lease_liabilities_noncurrent: "no XBRL fact before FY2019"
  total_liabilities: "no XBRL fact before FY2009"
  common_stock_apic: "no XBRL fact before FY2009"
  retained_earnings: "no XBRL fact before FY2009"
  aoci: "no XBRL fact before FY2009"
  equity_parent: "no XBRL fact before FY2009"
  nci: "noncontrolling interests ended in FY2023"
  total_liabilities_and_equity: "no XBRL fact before FY2009"
  deferred_taxes: "tagged IncreaseDecreaseInDeferredIncomeTaxes, of opposite polarity: one sign cannot fit both (see S3 log)"
  change_receivables: "no receivables line in Costco's cash flow statement"
  acquisitions: "acquisitions only in FY2019-22"
  sales_maturities_of_investments: "FY2008: maturities are not tagged (FY2009-11 are summed from two tags)"

# Concepts of the latest 10-K that the edgartools table recognizes but Bedrock does not map, each a
# decision (map-xbrl run of 2026-10-09). test_mapping_coverage.py fails on a concept not listed here and
# on a listed one that is mapped or gone.
acknowledged_unmapped:
  us-gaap:AvailableForSaleSecuritiesDebtMaturitiesAfterFiveThroughTenYearsFairValue: "investments-note maturity detail, not a balance-sheet line"
  us-gaap:AvailableForSaleSecuritiesDebtSecurities: "investments-note total of debt securities; the balance-sheet investment lines are mapped"
  us-gaap:BuildingsAndImprovementsGross: "property-note component, gross of depreciation; ppe_net is the net balance-sheet line"
  us-gaap:CapitalExpendituresIncurredButNotYetPaid: "non-cash supplemental disclosure, not the cash paid for capex"
  us-gaap:ConstructionInProgressGross: "property-note component, gross of depreciation; ppe_net is the net balance-sheet line"
  us-gaap:DebtInstrumentCarryingAmount: "debt-note amount of the notes (long-term total with its current part), not a balance-sheet line; the short- and long-term debt lines are mapped"
  us-gaap:FinanceLeaseInterestExpense: "lease-note component of interest; interest_expense is the total interest line"
  us-gaap:FinanceLeaseLiabilityCurrent: "finance lease liabilities sit in other liabilities, outside the debt lines (the mapped debt lines match the 10-K face lines without them)"
  us-gaap:FinanceLeaseLiabilityNoncurrent: "finance lease liabilities sit in other liabilities, outside the debt lines (the mapped debt lines match the 10-K face lines without them)"
  us-gaap:FinanceLeaseLiabilityUndiscountedExcessAmount: "lease maturity-note detail (undiscounted excess), not a balance-sheet line"
  us-gaap:FixturesAndEquipmentGross: "property-note component, gross of depreciation; ppe_net is the net balance-sheet line"
  us-gaap:HeldToMaturitySecurities: "investments-note component, not a balance-sheet line"
  us-gaap:IncomeLossAttributableToParent: "equals income before taxes every year (12,251 in FY2026), not net income (9,226), which is mapped"
  us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesDomestic: "domestic part of income before taxes (tax note); pretax_income is the total"
  us-gaap:InterestPaidNet: "supplemental cash disclosure of interest paid, not the expense"
  us-gaap:Land: "property-note component; ppe_net is the net balance-sheet line"
  us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalAfterYearFive: "debt maturity schedule, not a balance-sheet line"
  us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInNextTwelveMonths: "debt maturity schedule, not a balance-sheet line"
  us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFive: "debt maturity schedule, not a balance-sheet line"
  us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearFour: "debt maturity schedule, not a balance-sheet line"
  us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearThree: "debt maturity schedule, not a balance-sheet line"
  us-gaap:LongTermDebtMaturitiesRepaymentsOfPrincipalInYearTwo: "debt maturity schedule, not a balance-sheet line"
  us-gaap:OperatingLeaseLiability: "current plus noncurrent operating lease liability; the canonical line is the noncurrent one"
  us-gaap:ProceedsFromShortTermDebt: "short-term borrowings are a separate cash-flow line; debt_issued holds long-term issuance and the financing residual absorbs this line (decision to review)"
  us-gaap:RepaymentsOfShortTermDebt: "short-term repayments are a separate cash-flow line; debt_repaid holds long-term repayment and the financing residual absorbs this line (decision to review)"
