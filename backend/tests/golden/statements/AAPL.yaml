# Apple Inc. (CIK 320193) — golden figures from the 10-K documents on sec.gov, never from companyfacts.
# Values are USD (EPS: USD per share) in the displayed sign convention: expenses positive,
# capex negative (an outflow). Read from the filings' R pages (XBRL viewer renderings of the statements).
#   FY2015: 10-K filed 2015-10-28, accession 0001193125-15-356351 (FYE 2015-09-26)
#   FY2020: 10-K filed 2020-10-30, accession 0000320193-20-000096 (FYE 2020-09-26)
#   FY2025: 10-K filed 2025-10-31, accession 0000320193-25-000079 (FYE 2025-09-27)
# Each 10-K was checked for total liabilities + total equity = total assets.
# FY2015 total assets and total liabilities are the restated figures from the FY2016 10-K
# (accession 0001628280-16-020309, ASU 2015-03 / 2015-17 applied retrospectively): the engine shows the latest
# vintage, and the original FY2015 10-K value stays available as an earlier vintage.
annual:
  FY2015:
    revenue: 233715000000
    gross_profit: 93626000000
    operating_income: 71230000000
    net_income: 53394000000
    eps_diluted: 9.22
    cash: 21120000000
    total_assets: 290345000000      # restated in the FY2016 10-K; the FY2015 10-K said 290,479
    total_liabilities: 170990000000 # restated in the FY2016 10-K; the FY2015 10-K said 171,124
    total_equity: 119355000000
    cfo: 81266000000
    capex: -11247000000
