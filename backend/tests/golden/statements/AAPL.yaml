# Q4 of the latest FY = 10-K FY revenue minus the nine-month revenue of the Q3 10-Q
# (accession 0000320193-25-000073, nine months ended 2025-06-28: 313,695 million).
# 416,161 - 313,695 = 102,466 million.
quarterly:
  FY2025Q4:
    revenue: 102466000000

