    gross_margin: 0.679441
    # operating income 155,237 / revenue 331,839 [10-K FY2026]
    operating_margin: 0.467808
    # net income 133,749 / revenue 331,839 [10-K FY2026]
    net_margin: 0.403054
    # (cash from operations 182,935 + capex -115,948) = 66,987 / revenue 331,839 [10-K FY2026]
    fcf_margin: 0.201866
    # net income 133,749 / avg(equity 442,387, 343,479) = 392,933 [10-K FY2026]
    roe: 0.340386
    # net income 133,749 / avg(total assets 758,376, 619,003) = 688,689.5 [10-K FY2026]
    roa: 0.194208
    # tax rate = provision 32,185 / pretax 165,934 = 0.193963; nopat = operating income 155,237 x (1 - 0.193963) = 125,126.819
    # invested capital FY2026 = debt (current portion 9,227 + long-term debt 31,067 = 40,294) + equity 442,387
    #   - cash 20,935 - short-term investments 55,908 = 405,838
    # invested capital FY2025 = debt (2,999 + 40,152 = 43,151) + equity 343,479 - cash 30,242 - 64,323 = 292,065
    # 125,126.819 / avg(405,838, 292,065) = 348,951.5 [all 10-K FY2026]
    roic: 0.358579
    # total debt 40,294 (9,227 + 31,067) / total equity 442,387 [10-K FY2026]
    debt_to_equity: 0.091083
    # total current assets 207,710 / total current liabilities 168,825 [10-K FY2026]
    current_ratio: 1.230327
    # (cash 20,935 + short-term investments 55,908 + accounts receivable 80,876) = 157,719 / current liabilities 168,825 [10-K FY2026]
    quick_ratio: 0.934216
    # operating income 155,237 / interest expense 3,051 [10-K FY2026, components of other income note]
    interest_coverage: 50.880695
    # revenue 331,839 / avg(total assets 758,376, 619,003) = 688,689.5 [10-K FY2026]
    asset_turnover: 0.481841
    # avg(total assets) 688,689.5 / avg(equity 442,387, 343,479) = 392,933 [10-K FY2026]
    dupont_equity_multiplier: 1.752689
    # avg(accounts receivable 80,876, 69,905) = 75,390.5 / revenue 331,839 x 365 [10-K FY2026]
    dso: 82.924347
    # avg(accounts payable 42,416, 27,724) = 35,070 / cost of revenue 106,374 x 365 [10-K FY2026]
    dpo: 120.335326
    # diluted EPS 17.95 [10-K FY2026]
    eps_diluted: 17.95
    # equity 442,387 / shares outstanding 7,427 million at 2026-06-30 [10-K FY2026 balance-sheet parenthetical]
