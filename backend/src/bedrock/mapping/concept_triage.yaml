# structure rules (docs/erd/data-coverage.md "Structure rules"), `codes` name every canonical line
# whose amount the line may hold: a face line whose verdict names a line blocks that line's
# inferred zero (R9). Catch-all lines therefore name the lines companies commonly fold into them.
