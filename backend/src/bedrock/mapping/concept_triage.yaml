InterestPaid:
  {type: rejected, codes: [interest_expense, cash_interest_paid], reason: "cash paid for interest including capitalized interest (a supplemental disclosure): not the expense, and wider than cash_interest_paid, which is net of capitalized interest (JNJ FY2012 576 against 492; M7b S5)"}
PropertySubjectToOrAvailableForOperatingLeaseAccumulatedDepreciation:
