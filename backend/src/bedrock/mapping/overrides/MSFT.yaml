# Short-term debt is a balance-sheet line only when Microsoft has commercial paper (FY2014-18 tagged
# ShortTermBorrowings, which already includes it, so CommercialPaper must not be added; FY2024-25
# tagged CommercialPaper), plus the current portion of long-term debt. In the years with no such
# line (FY2019-22, FY2026) the current portion is the whole item, checked against the 10-Ks.
short_term_debt:
  - us-gaap:ShortTermBorrowings + us-gaap:LongTermDebtCurrent
  - us-gaap:CommercialPaper + us-gaap:LongTermDebtCurrent
  - us-gaap:LongTermDebtCurrent
# Finance leases count as debt (M3 S6, user decision). Microsoft's lease note puts them in "Other
# current liabilities" and "Other long-term liabilities" (outside the debt lines) and companyfacts
# carries only their total, FinanceLeaseLiability (FY2017 on, every quarter). That total joins
# long-term debt, so the current part (3,172 of 46,172 in FY2025) sits in the long-term line:
# total_debt and net_debt are right, the split is approximate.
long_term_debt:
  - us-gaap:LongTermDebtNoncurrent + us-gaap:FinanceLeaseLiability
# M7b S7, extension tags (principle 2: the override file is where an extension reaches a row).
# "Depreciation, amortization, and other" is Microsoft's only D&A line on the cash flow, filed as
# msft:DepreciationAmortizationAndOther in every 10-K read (FY2015 3,755..5,957; FY2026 38,534).
# Its "and other" is part of the line as Microsoft presents it.
d_and_a:
  - msft:DepreciationAmortizationAndOther
# "Acquisition of companies, net of cash acquired, and purchases of intangible and other assets":
# the default tag ranks first, so FY2008-11 keep the business-acquisition figure; the extension
# (two spellings: FY2015 "...Netof...Intangibleand...") fills the later years.
acquisitions:
  - us-gaap:PaymentsToAcquireBusinessesNetOfCashAcquired
  - msft:AcquisitionsNetOfCashAcquiredAndPurchasesOfIntangibleAndOtherAssets
  - msft:AcquisitionsNetofCashAcquiredAndPurchasesOfIntangibleandOtherAssets
# "Sales of investments" (msft:ProceedsFromInvestments, FY2019 on) and "Maturities of investments"
# (us-gaap) are two lines; anchored on the extension. Before FY2019 both lines are us-gaap face
# members and the face sum (R8) adds them.
sales_maturities_of_investments:
  - msft:ProceedsFromInvestments + us-gaap:ProceedsFromMaturitiesPrepaymentsAndCallsOfAvailableForSaleSecurities
# The other extension lines of the cash flow are left for the user (Data gaps, "Lines to classify").
