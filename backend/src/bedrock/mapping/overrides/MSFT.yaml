# Microsoft shows sales and marketing and general and administrative as two lines and no total.
sga:
  - us-gaap:SellingAndMarketingExpense + us-gaap:GeneralAndAdministrativeExpense
# Short-term debt is a balance-sheet line only when Microsoft has commercial paper (FY2014-18 tagged
# ShortTermBorrowings, which already includes it, so CommercialPaper must not be added; FY2024-25
# tagged CommercialPaper), plus the current portion of long-term debt. In the years with no such
# line (FY2019-22, FY2026) the current portion is the whole item, checked against the 10-Ks.
short_term_debt:
  - us-gaap:ShortTermBorrowings + us-gaap:LongTermDebtCurrent
  - us-gaap:CommercialPaper + us-gaap:LongTermDebtCurrent
  - us-gaap:LongTermDebtCurrent
