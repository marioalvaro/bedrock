# Crosswalk from the edgartools standard concepts (vendor/edgartools_gaap_mappings.json) to Bedrock
# canonical codes. It feeds the *candidates* layer only (mapping/candidates.py): a hint in the Data gaps
# report and a prompt for the map-xbrl skill. It is never applied to statements, because an edgartools
# concept is coarser than a Bedrock line (see docs/erd/data.md, "Mapping principles").
#
# Every standard concept of the vendored table must appear in exactly one section:
#   codes:    the concept is the same kind of line as these Bedrock codes (a hint, not a mapping)
#   unmapped: no canonical code matches, with the reason; "no canonical line" means the value is
#             absorbed by a residual item or not shown
# Loading fails on a concept that is missing, listed twice, or points at an unknown or residual code.

codes:
  AccumulatedOtherComprehensiveIncome: aoci
  AcquisitionsNet: acquisitions
  AdditionalPaidInCapital: common_stock_apic
  AllEquityBalance: equity_parent
  AllEquityBalanceIncludingMinorityInterest: total_equity
  Assets: total_assets
  CapitalExpenses: capex
  ChangeInInventory: change_inventory
  ChangeInPayables: change_payables
  ChangeInReceivables: change_receivables
  CostOfGoodsAndServicesSold: cost_of_revenue
  CurrentAssetsTotal: total_current_assets
  CurrentLiabilitiesTotal: total_current_liabilities
  CurrentPortionOfLongTermDebt: short_term_debt
  DebtProceeds: debt_issued
  DebtRepayments: debt_repaid
  DeferredIncomeTaxCF: deferred_taxes
  DeferredRevenueCurrent: deferred_revenue_current
  DepreciationAmortizationCF: d_and_a
  EarningsPerShareBasic: eps_basic
  EarningsPerShareDiluted: eps_diluted
  ForeignExchangeEffectOnCash: fx_effect
  Goodwill: goodwill
  GrossProfit: gross_profit
  IntangibleAssets: intangibles
  InterestExpense: interest_expense
  Inventories: inventory
  InvestmentProceeds: sales_maturities_of_investments
  InvestmentPurchases: purchases_of_investments
  Liabilities: total_liabilities
  LiabilitiesAndEquity: total_liabilities_and_equity
  LongTermDebt: long_term_debt
  LongtermInvestments: long_term_investments
  MinorityInterestBS: nci
  MinorityInterestBalance: nci
  MinorityInterestIncomeExpense: net_income_nci
  NetIncome: net_income_common
  OperatingIncomeLoss: operating_income
