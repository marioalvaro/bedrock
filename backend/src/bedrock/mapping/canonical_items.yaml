# Accounting identities that fill an empty term from the others (docs/erd/data.md, "R1: identities").
# Equations are in displayed values. Only terms under `solve` may be solved; modes: zero_only (the
# result must be about 0 and is stored as an inferred 0), exact (a complete accounting definition),
# bounded (|result| <= max_ratio x the largest other term).
identities:
  - id: cash_rollforward
    equation: net_change_in_cash = cfo + cfi + cff + fx_effect
    solve: {fx_effect: {mode: bounded, max_ratio: 0.05}}
  - id: gross_profit
    equation: gross_profit = revenue - cost_of_revenue
    solve: {cost_of_revenue: {mode: exact}}
  - id: equity_split
    equation: total_equity = equity_parent + nci
    solve: {nci: {mode: zero_only}, equity_parent: {mode: exact}}
  - id: net_income_split
    equation: net_income = net_income_common + net_income_nci
    solve: {net_income_nci: {mode: zero_only}}
  - id: balance_sheet
    equation: total_liabilities_and_equity = total_liabilities + temporary_equity + total_equity
    solve: {temporary_equity: {mode: zero_only}}
  - id: total_assets_equals_le
    equation: total_assets = total_liabilities_and_equity
    solve: {total_assets: {mode: exact}, total_liabilities_and_equity: {mode: exact}}
  - id: shares_outstanding_count
    equation: shares_outstanding = shares_issued - treasury_shares
    solve: {shares_outstanding: {mode: exact}}
  # M7b S4 scope identities (docs/erd/data-coverage.md "Scope identities")
  - id: long_term_debt_split
    equation: long_term_debt_total = long_term_debt + long_term_debt_current
    solve: {long_term_debt: {mode: exact}}
    note: "debt only: the total concept carries no finance lease"
  - id: operating_lease_split
    equation: operating_lease_liabilities_total = operating_lease_liabilities_noncurrent + operating_lease_liabilities_current
    solve: {operating_lease_liabilities_noncurrent: {mode: exact}}
