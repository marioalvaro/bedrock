# Canonical line items. File order is display order, each subtotal above its breakdown. `concepts` are filled per company by the map-xbrl skill (M1 S3).
# Format and rules: docs/erd/data.md, "Canonical mapping file". `required: true` marks a line every
# company has: coverage counts it as a gap even when never reported (M7b S5, user 2026-11-14).
items:
- code: revenue
  statement: IS
  label: Revenue
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: [gross_profit]
  concepts:
    - us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax
    - us-gaap:Revenues
    - us-gaap:SalesRevenueNet
  required: true
  residual: false
- code: cost_of_revenue
  statement: IS
  label: Cost of revenue
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: ["-gross_profit"]
  concepts:
    - us-gaap:CostOfRevenue
    - us-gaap:CostOfGoodsAndServicesSold
    - us-gaap:CostOfGoodsSold
  required: true
  residual: false
- code: gross_profit
  statement: IS
  label: Gross profit
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: [operating_income]
  concepts:
    - us-gaap:GrossProfit
  derive: revenue - cost_of_revenue
  required: true
  residual: false
- code: total_operating_costs
  statement: IS
  label: Total operating costs
  kind: flow
  unit: USD
  sign: 1
  parent: null
  concepts: []
  derive: gross_profit - operating_income
  residual: false
- code: rnd
  statement: IS
  label: Research & development
  kind: flow
  unit: USD
  sign: 1
  parent: total_operating_costs
  rolls_into: ["-operating_income"]
  concepts:
    - us-gaap:ResearchAndDevelopmentExpense
  residual: false
- code: sga
  statement: IS
  label: Selling, general & administrative
  kind: flow
  unit: USD
  sign: 1
  parent: total_operating_costs
  rolls_into: ["-operating_income"]
  concepts:
    - us-gaap:SellingGeneralAndAdministrativeExpense
    # M7b S3: "Sales and marketing" + "General and administrative" on two lines (NFLX, ORCL);
    # anchored on selling, since a G&A line alone is a component of SG&A
    - us-gaap:SellingAndMarketingExpense + us-gaap:GeneralAndAdministrativeExpense
  residual: false
- code: other_operating_expenses
  statement: IS
  label: Other operating expenses
  kind: flow
  unit: USD
  sign: 1
  parent: total_operating_costs
  rolls_into: ["-operating_income"]
  concepts: []
  derive: gross_profit - rnd - sga - operating_income
  residual: true
- code: operating_income
  statement: IS
  label: Operating income
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: [pretax_income]
  concepts:
    - us-gaap:OperatingIncomeLoss
  required: true
  residual: false
- code: pretax_income
  statement: IS
  label: Pre-tax income
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: [net_income]
  concepts:
    - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
    - us-gaap:IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
  required: true
  residual: false
- code: interest_expense
  statement: IS
  label: Interest expense
  kind: flow
  unit: USD
  sign: 1
  parent: pretax_income
  rolls_into: ["-pretax_income"]
  concepts:
    - us-gaap:InterestExpense
    - us-gaap:InterestExpenseNonoperating
    - us-gaap:InterestAndDebtExpense  # M7b S3: BA "Interest and debt expense"
  required: true
  residual: false
- code: interest_income
  statement: IS
  label: Interest income
  kind: flow
  unit: USD
  sign: 1
  parent: pretax_income
  rolls_into: [pretax_income]
  # M7b S5: interest on nonoperating securities. InvestmentIncomeInterestAndDividend (dividends too)
  # and InterestIncomeOperating (operating scope) are other measures
  concepts:
    - us-gaap:InvestmentIncomeInterest
  forecast_fold: other_nonoperating_income
  residual: false
- code: other_nonoperating_income
  statement: IS
  label: Other non-operating income
  kind: flow
  unit: USD
  sign: 1
  parent: pretax_income
  rolls_into: [pretax_income]
  concepts: []
  derive: pretax_income - operating_income + interest_expense - interest_income
  residual: true
- code: net_income
  statement: IS
  label: Net income
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: [net_income_common]
  concepts:
    - us-gaap:ProfitLoss
    - us-gaap:NetIncomeLoss
  required: true
  residual: false
- code: income_tax
  statement: IS
  label: Income tax
  kind: flow
  unit: USD
  sign: 1
  parent: net_income
  rolls_into: ["-net_income"]
  concepts:
    - us-gaap:IncomeTaxExpenseBenefit
  required: true
  residual: false
- code: net_income_common
  statement: IS
  label: Net income to common
  kind: flow
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:NetIncomeLoss
  derive: net_income - net_income_nci
  residual: false
- code: net_income_nci
  statement: IS
  label: Net income attributable to non-controlling interests
  kind: flow
  unit: USD
  sign: 1
  parent: net_income_common
  rolls_into: ["-net_income_common"]
  concepts:
    - us-gaap:NetIncomeLossAttributableToNoncontrollingInterest
  residual: false
- code: eps_basic
  statement: IS
  label: EPS, basic
  kind: average
  unit: USD/shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:EarningsPerShareBasic
  residual: false
- code: eps_diluted
  statement: IS
  label: EPS, diluted
  kind: average
  unit: USD/shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:EarningsPerShareDiluted
  required: true
  residual: false
- code: dividends_per_share
  statement: IS
  label: Dividends per share
  kind: flow
  unit: USD/shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:CommonStockDividendsPerShareDeclared
    - us-gaap:CommonStockDividendsPerShareCashPaid
  residual: false
- code: shares_basic
  statement: IS
  label: Weighted-average shares, basic
  kind: average
  unit: shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:WeightedAverageNumberOfSharesOutstandingBasic
  residual: false
- code: shares_diluted
  statement: IS
  label: Weighted-average shares, diluted
  kind: average
  unit: shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:WeightedAverageNumberOfDilutedSharesOutstanding
  required: true
  residual: false
- code: goodwill_impairment
  statement: IS
  label: Goodwill impairment
  kind: flow
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:GoodwillImpairmentLoss
  residual: false
- code: total_assets
  statement: BS
  label: Total assets
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:Assets
  required: true
  residual: false
- code: total_current_assets
  statement: BS
  label: Total current assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_assets
  concepts:
    - us-gaap:AssetsCurrent
  residual: false
- code: cash
  statement: BS
  label: Cash & equivalents
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_assets
  concepts:
    - us-gaap:CashAndCashEquivalentsAtCarryingValue
    # M7b S4 combined line: cash and short-term investments reported as one line
    - {concept: "us-gaap:CashCashEquivalentsAndShortTermInvestments", covers: [short_term_investments]}
  required: true
  residual: false
- code: short_term_investments
  statement: BS
  label: Short-term investments
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_assets
  concepts:
    - us-gaap:ShortTermInvestments
    - us-gaap:MarketableSecuritiesCurrent
    - us-gaap:AvailableForSaleSecuritiesCurrent
  residual: false
- code: receivables
  statement: BS
  label: Receivables
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_assets
  concepts:
    - us-gaap:AccountsReceivableNetCurrent
    - us-gaap:ReceivablesNetCurrent
  residual: false
- code: inventory
  statement: BS
  label: Inventory
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_assets
  concepts:
    - us-gaap:InventoryNet
    # M7b S3: inventory net of customer advances on long-term contracts, as BA presents it
    - us-gaap:InventoryNetOfAllowancesCustomerAdvancesAndProgressBillings
  residual: false
- code: other_current_assets
  statement: BS
  label: Other current assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_assets
  concepts: []
  derive: total_current_assets - cash - short_term_investments - receivables - inventory
  residual: true
- code: total_noncurrent_assets
  statement: BS
  label: Total non-current assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_assets
  concepts: []
  derive: total_assets - total_current_assets
  residual: false
- code: ppe_net
  statement: BS
  label: Property, plant & equipment, net
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  concepts:
    - us-gaap:PropertyPlantAndEquipmentNet
  residual: false
- code: operating_lease_rou
  statement: BS
  label: Operating lease right-of-use assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  concepts:
    - us-gaap:OperatingLeaseRightOfUseAsset
  residual: false
  starts_with_standard: true
- code: goodwill
  statement: BS
  label: Goodwill
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  concepts:
    - us-gaap:Goodwill
  residual: false
- code: intangibles
  statement: BS
  label: Intangible assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  concepts:
    - us-gaap:IntangibleAssetsNetExcludingGoodwill
    - us-gaap:FiniteLivedIntangibleAssetsNet
  residual: false
- code: long_term_investments
  statement: BS
  label: Long-term investments
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  concepts:
    - us-gaap:LongTermInvestments
    - us-gaap:MarketableSecuritiesNoncurrent
    - us-gaap:AvailableForSaleSecuritiesNoncurrent
  residual: false
- code: deferred_tax_assets
  statement: BS
  label: Deferred tax assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  # M7b S5: the balance-sheet line after jurisdictional netting. The noncurrent tag ranks first:
  # before ASU 2015-17 the net tag can be the whole net position, current part included.
  # DeferredTaxAssetsNet is the tax note's figure before netting, not the line
  concepts:
    - us-gaap:DeferredTaxAssetsNetNoncurrent
    - us-gaap:DeferredIncomeTaxAssetsNet
  forecast_fold: other_noncurrent_assets
  residual: false
- code: other_noncurrent_assets
  statement: BS
  label: Other non-current assets
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_assets
  concepts: []
  derive: total_noncurrent_assets - ppe_net - operating_lease_rou - goodwill - intangibles - long_term_investments - deferred_tax_assets
  residual: true
- code: total_liabilities
  statement: BS
  label: Total liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: null
  rolls_into: [total_liabilities_and_equity]
  concepts:
    - us-gaap:Liabilities
  derive: total_liabilities_and_equity - total_equity
  required: true
  residual: false
- code: total_current_liabilities
  statement: BS
  label: Total current liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: total_liabilities
  concepts:
    - us-gaap:LiabilitiesCurrent
  residual: false
- code: accounts_payable
  statement: BS
  label: Accounts payable
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_liabilities
  concepts:
    - us-gaap:AccountsPayableCurrent
  residual: false
- code: short_term_debt
  statement: BS
  label: Short-term debt
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_liabilities
  concepts:
    - us-gaap:DebtCurrent + us-gaap:FinanceLeaseLiabilityCurrent + us-gaap:CapitalLeaseObligationsCurrent
  required: true
  residual: false
- code: deferred_revenue_current
  statement: BS
  label: Deferred revenue, current
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_liabilities
  concepts:
    - us-gaap:ContractWithCustomerLiabilityCurrent
    - us-gaap:DeferredRevenueCurrent
  residual: false
- code: accrued_liabilities
  statement: BS
  label: Accrued liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_liabilities
  concepts:
    - us-gaap:AccruedLiabilitiesCurrent
  residual: false
- code: other_current_liabilities
  statement: BS
  label: Other current liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: total_current_liabilities
  concepts: []
  derive: total_current_liabilities - accounts_payable - short_term_debt - deferred_revenue_current - accrued_liabilities
  residual: true
- code: total_noncurrent_liabilities
  statement: BS
  label: Total non-current liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: total_liabilities
  concepts: []
  derive: total_liabilities - total_current_liabilities
  residual: false
- code: long_term_debt
  statement: BS
  label: Long-term debt
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_liabilities
  concepts:
    - us-gaap:LongTermDebtNoncurrent + us-gaap:FinanceLeaseLiabilityNoncurrent + us-gaap:CapitalLeaseObligationsNoncurrent
    - us-gaap:LongTermDebtAndCapitalLeaseObligations  # M7b S3: the noncurrent debt and lease total (BA)
  required: true
  residual: false
- code: operating_lease_liabilities_noncurrent
  statement: BS
  label: Operating lease liabilities, non-current
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_liabilities
  concepts:
    - us-gaap:OperatingLeaseLiabilityNoncurrent
  residual: false
  starts_with_standard: true
- code: deferred_revenue_noncurrent
  statement: BS
  label: Deferred revenue, non-current
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_liabilities
  # M7b S5: in the order of deferred_revenue_current (the ASC 606 tag first)
  concepts:
    - us-gaap:ContractWithCustomerLiabilityNoncurrent
    - us-gaap:DeferredRevenueNoncurrent
  forecast_fold: other_noncurrent_liabilities
  residual: false
- code: deferred_tax_liabilities
  statement: BS
  label: Deferred tax liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_liabilities
  # M7b S5: as deferred_tax_assets (DeferredTaxLiabilities is the note's gross figure). A line
  # "Deferred income taxes and other" is the combined entry: the other liabilities are inside it
  concepts:
    - us-gaap:DeferredTaxLiabilitiesNoncurrent
    - us-gaap:DeferredIncomeTaxLiabilitiesNet
    - concept: us-gaap:DeferredIncomeTaxesAndOtherLiabilitiesNoncurrent
      covers: []
  forecast_fold: other_noncurrent_liabilities
  residual: false
- code: pension_liabilities
  statement: BS
  label: Pension and postretirement benefits
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_liabilities
  # M7b S5: the defined benefit plans' noncurrent liability; the sum is the same scope on two lines
  # (pension, other postretirement), anchored on pension
  concepts:
    - us-gaap:PensionAndOtherPostretirementDefinedBenefitPlansLiabilitiesNoncurrent
    - us-gaap:DefinedBenefitPensionPlanLiabilitiesNoncurrent + us-gaap:OtherPostretirementDefinedBenefitPlanLiabilitiesNoncurrent
  forecast_fold: other_noncurrent_liabilities
  residual: false
- code: other_noncurrent_liabilities
  statement: BS
  label: Other non-current liabilities
  kind: instant
  unit: USD
  sign: 1
  parent: total_noncurrent_liabilities
  concepts: []
  derive: total_noncurrent_liabilities - long_term_debt - operating_lease_liabilities_noncurrent - deferred_revenue_noncurrent - deferred_tax_liabilities - pension_liabilities
  residual: true
- code: temporary_equity
  statement: BS
  label: Temporary equity
  kind: instant
  unit: USD
  sign: 1
  parent: null
  rolls_into: [total_liabilities_and_equity]
  concepts:
    - us-gaap:TemporaryEquityCarryingAmountIncludingPortionAttributableToNoncontrollingInterests
    - us-gaap:RedeemableNoncontrollingInterestEquityCarryingAmount
  residual: false
- code: total_equity
  statement: BS
  label: Total equity
  kind: instant
  unit: USD
  sign: 1
  parent: null
  rolls_into: [total_liabilities_and_equity]
  concepts:
    - us-gaap:StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
    - us-gaap:StockholdersEquity
  derive: equity_parent + nci
  required: true
  residual: false
- code: equity_parent
  statement: BS
  label: Equity attributable to parent
  kind: instant
  unit: USD
  sign: 1
  parent: total_equity
  concepts:
    - us-gaap:StockholdersEquity
  residual: false
- code: common_stock_apic
  statement: BS
  label: Common stock & APIC
  kind: instant
  unit: USD
  sign: 1
  parent: equity_parent
  concepts:
    - us-gaap:CommonStocksIncludingAdditionalPaidInCapital
    - us-gaap:AdditionalPaidInCapitalCommonStock
    - us-gaap:AdditionalPaidInCapital
  residual: false
- code: retained_earnings
  statement: BS
  label: Retained earnings
  kind: instant
  unit: USD
  sign: 1
  parent: equity_parent
  concepts:
    - us-gaap:RetainedEarningsAccumulatedDeficit
  residual: false
- code: aoci
  statement: BS
  label: Accumulated other comprehensive income
  kind: instant
  unit: USD
  sign: 1
  parent: equity_parent
  concepts:
    - us-gaap:AccumulatedOtherComprehensiveIncomeLossNetOfTax
  residual: false
- code: other_equity
  statement: BS
  label: Other equity
  kind: instant
  unit: USD
  sign: 1
  parent: equity_parent
  concepts: []
  derive: equity_parent - common_stock_apic - retained_earnings - aoci
  residual: true
- code: nci
  statement: BS
  label: Non-controlling interests
  kind: instant
  unit: USD
  sign: 1
  parent: total_equity
  concepts:
    - us-gaap:MinorityInterest
  residual: false
- code: total_liabilities_and_equity
  statement: BS
  label: Total liabilities & equity
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:LiabilitiesAndStockholdersEquity
  residual: false
- code: total_debt
  statement: BS
  label: Total debt
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts: []
  derive: short_term_debt + long_term_debt
  required: true
  residual: false
- code: net_debt
  statement: BS
  label: Net debt
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts: []
  derive: total_debt - cash - short_term_investments
  residual: false
- code: shares_outstanding
  statement: BS
  label: Shares outstanding
  kind: instant
  unit: shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:CommonStockSharesOutstanding
  residual: false
- code: shares_issued
  statement: BS
  label: Shares issued
  kind: instant
  unit: shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:CommonStockSharesIssued
  residual: false
- code: treasury_shares
  statement: BS
  label: Treasury shares
  kind: instant
  unit: shares
  sign: 1
  parent: null
  concepts:
    - us-gaap:TreasuryStockCommonShares
    - us-gaap:TreasuryStockShares
  residual: false
# M7b S4: totals of a different scope, operands of the scope identities (never shown as missing)
- code: long_term_debt_total
  statement: BS
  label: Long-term debt incl. current portion
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:LongTermDebt
  residual: false
- code: long_term_debt_current
  statement: BS
  label: Current portion of long-term debt
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:LongTermDebtCurrent
  residual: false
- code: operating_lease_liabilities_total
  statement: BS
  label: Operating lease liabilities, total
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:OperatingLeaseLiability
  residual: false
- code: operating_lease_liabilities_current
  statement: BS
  label: Operating lease liabilities, current
  kind: instant
  unit: USD
  sign: 1
  parent: null
  concepts:
    - us-gaap:OperatingLeaseLiabilityCurrent
  residual: false
- code: cfo
  statement: CF
  label: Cash from operations
  kind: flow
  unit: USD
  sign: 1
  parent: null
  rolls_into: [net_change_in_cash]
  concepts:
    - us-gaap:NetCashProvidedByUsedInOperatingActivities
    - us-gaap:NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
  required: true
  residual: false
- code: cf_net_income
  statement: CF
  label: Net income
  kind: flow
  unit: USD
  sign: 1
  parent: cfo
  concepts:
    - us-gaap:ProfitLoss
    - us-gaap:NetIncomeLoss
  residual: false
- code: d_and_a
  statement: CF
  label: Depreciation & amortization
  kind: flow
  unit: USD
  sign: 1
  parent: cfo
  concepts:
    - us-gaap:DepreciationAmortizationAndAccretionNet
    - us-gaap:DepreciationDepletionAndAmortization
    - us-gaap:DepreciationAndAmortization
  residual: false
- code: sbc
  statement: CF
  label: Stock-based compensation
  kind: flow
  unit: USD
  sign: 1
  parent: cfo
  concepts:
    - us-gaap:ShareBasedCompensation
    - us-gaap:AllocatedShareBasedCompensationExpense
  residual: false
- code: deferred_taxes
  statement: CF
  label: Deferred taxes
  kind: flow
  unit: USD
  sign: 1
  parent: cfo
  concepts:
    - us-gaap:DeferredIncomeTaxesAndTaxCredits
    - us-gaap:DeferredIncomeTaxExpenseBenefit
  residual: false
- code: change_receivables
  statement: CF
  label: Change in receivables
  kind: flow
  unit: USD
  sign: -1
  parent: cfo
  concepts:
    - us-gaap:IncreaseDecreaseInAccountsReceivable
    - us-gaap:IncreaseDecreaseInReceivables
    # M7b S4 combined line: trade and other receivables in one change (WMT)
    - {concept: "us-gaap:IncreaseDecreaseInAccountsAndOtherReceivables", covers: []}
  residual: false
- code: change_inventory
  statement: CF
  label: Change in inventory
  kind: flow
  unit: USD
  sign: -1
  parent: cfo
  concepts:
    - us-gaap:IncreaseDecreaseInInventories
  residual: false
- code: change_payables
  statement: CF
  label: Change in payables
  kind: flow
  unit: USD
  sign: 1
  parent: cfo
  concepts:
    - us-gaap:IncreaseDecreaseInAccountsPayable
