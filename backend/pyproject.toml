[project]
name = "bedrock"
version = "0.1.0"
description = "Bedrock backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "typer",
    "argon2-cffi",
    "itsdangerous",
    "pandas>=3.0.6",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "yfinance>=1.7.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
]

[project.scripts]
bedrock = "bedrock.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bedrock/api/**" = ["B008"]  # FastAPI's Depends(...) default-arg pattern

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real external APIs (opt-in)"]
addopts = "-m 'not live'"
