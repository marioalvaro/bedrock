[project]
name = "bedrock"
version = "0.1.0"
description = "Bedrock backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "typer",
    "argon2-cffi",
    "itsdangerous",
]

[project.scripts]
bedrock = "bedrock.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bedrock/api/**" = ["B008"]  # FastAPI's Depends(...) default-arg pattern
"src/bedrock/core/auth.py" = ["B008"]  # FastAPI's Depends(...) default-arg pattern

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
